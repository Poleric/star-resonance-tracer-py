[project]
name = "star-resonance-tracer"
version = "0.1.2"
authors = [
    { name = "Poleric", email = "laffey@dizzynight.moe" }
]
description = "A library of tools to handle and process packets from BPSR."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "protobuf>=6.33.6",
    "zstandard>=0.25.0",
    "cachetools>=7.1.3",
    "psutil>=7.2.2",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E"]

[project.urls]
Homepage = "https://github.com/Poleric/star-resonance-tracer-py"

[build-system]
requires = ["hatchling", "grpcio_tools>1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = [
    "src/star_resonance_tracer/proto"
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.hooks.custom]

