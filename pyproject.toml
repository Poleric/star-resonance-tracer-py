[project]
name = "star-resonance-tracer"
version = "0.1.0"
authors = [
    { name = "Poleric", email = "laffey@dizzynight.moe" }
]
description = "A library of tools to handle and process packets from BPSR."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "protobuf>=6.33.6",
    "zstandard>=0.25.0",
    "cachetools>=7.1.3",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E"]

[project.urls]
Homepage = "https://github.com/Poleric/star-resonance-tracer-py"

[dependency-groups]
dev = [
    "grpcio-tools>=1.80.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

